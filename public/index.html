<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Course Manager</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Courses">
      <div class="sidebar-head">
        <a class="brand" href="#/">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Course Manager</span>
        </a>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <div class="workspace">
      <header class="workbar">
        <button class="icon-btn" id="toggle-sidebar" type="button"
                title="Toggle sidebar (Ctrl+B)" aria-label="Toggle sidebar">
          <span class="icon-bars" aria-hidden="true"></span>
        </button>
        <nav class="workbar-actions" id="topbar-actions"></nav>
        <div class="pomo" id="pomodoro"></div>
        <button class="icon-btn" id="toggle-focus" type="button"
                title="Distraction-free mode (Esc to exit)" aria-label="Distraction-free mode">
          <span class="icon-focus" aria-hidden="true"></span>
        </button>
      </header>
      <main id="app" class="workspace-body" aria-live="polite"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
